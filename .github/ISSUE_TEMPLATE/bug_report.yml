name: Bug report
description: Report a reproducible problem in TubePreview.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Samsung Galaxy A55, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: Version 1.0 or a commit hash
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private images and credentials before attaching files.
