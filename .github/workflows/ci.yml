name: Build and security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Gradle wrapper
        run: printf '%s  %s\n' '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Build, unit tests, lint, and dependency inventory
        run: >
          bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          :app:lintDebug :app:lintRelease :app:auditDependencies
          --init-script scripts/security-audit.init.gradle
          --no-configuration-cache --stacktrace -Pandroid.builder.sdkDownload=true
      - name: Build unminified release variant
        run: >
          bash ./gradlew :app:assembleRelease
          --init-script scripts/release-unminified.init.gradle
          --no-configuration-cache --stacktrace -Pandroid.builder.sdkDownload=true
      - name: Check resolved dependencies against OSV
        run: node scripts/audit-dependencies.mjs
